<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VibeVote - 실시간 크로스플랫폼 투표</title>
  <meta name="description" content="X(트위터), 카카오톡, 디시인사이드 등 모든 플랫폼에서 투표하고 플랫폼별 결과를 비교하세요! 로그인 없이 3초면 끝.">
  <meta name="keywords" content="투표, 실시간투표, 크로스플랫폼, X투표, 카톡투표, 디시투표">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<link rel="icon" href="./img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="./img/favicon.png">

<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="progress-bar" class="loading"></div>

<!-- TOPBAR -->
<header id="topbar">
  <div class="topbar-left">
    <a href="index.html" style="text-decoration:none;">
      <span class="logo">Vibe<em>Vote</em></span>
    </a>
    <span class="badge">Dashboard</span>
  </div>
  <div class="topbar-right">
    <div class="status-pill" id="live-pill">
      <span class="status-dot"></span>
      <span>Live</span>
    </div>
    <span id="topbar-vote-count" style="font-size:11px;font-family:var(--font-mono);color:var(--muted);">
      0 votes
    </span>
  </div>
</header>

<!-- STAGE -->
<div id="stage-wrap">
  <div id="app-stage">
    <div class="stage-content">
      <div class="page-inner" id="dash-content">
        <!-- Rendered by dashboard.js -->
      </div>
    </div>
  </div>
</div>

<!-- COCKPIT -->
<div id="cockpit">
  <div id="ai-voice">Auto-refreshing every 2s · Source detected from referrer</div>
  <div id="chips-row">
    <a href="index.html" class="chip">← Feed</a>
    <button class="chip" id="btn-new-poll">＋ New Poll</button>
  </div>
</div>

<div id="toast"></div>

<script src="dashboard.js"></script>
</body>
</html>
